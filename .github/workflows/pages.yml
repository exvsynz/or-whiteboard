name: Deploy demo to GitHub Pages

# Publishes the demo-mode static export (localStorage, no backend) to
# https://exvsynz.github.io/or-whiteboard/ on every push to the work branch.
on:
  push:
    branches: [feat/sync-overhaul]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static demo export
        env:
          NEXT_EXPORT: "1"
          GH_PAGES: "1"
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: npm run build
      # GitHub Pages runs Jekyll, which ignores _next/* without this.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
